# Render Blueprint — deploy Clan Siege Arena as a static site.
# Docs: https://render.com/docs/blueprint-spec
#
# The game is a Vite build that outputs to ./dist, so a free Static Site fits.
services:
  - type: web
    runtime: static
    name: clan-siege-arena
    # Use npm ci when a lockfile is present for reproducible installs.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # SPA fallback: serve index.html for any path so deep links don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
