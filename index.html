<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Clan Siege Arena</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0e13" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
        /* Mobile browser requirement: block native scroll/zoom gestures */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }

      #game-root {
        width: 100vw;
        height: 100vh;
      }

      /* Shown when the device is held in portrait; hidden in landscape */
      #rotate-hint {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #0b0e13;
        color: #e6edf3;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        z-index: 1000;
      }

      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="rotate-hint">
      <div style="font-size: 48px">↻</div>
      <div style="font-size: 18px">Please rotate your device to landscape</div>
    </div>
    <script>
      // Mobile browser requirement (doc 7.2): block double-tap-to-zoom, which
      // `user-scalable=no` alone does not stop on every browser.
      let lastTouchEnd = 0;
      document.addEventListener(
        'touchend',
        (event) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false },
      );

      // Block multi-touch pinch-zoom gestures.
      document.addEventListener(
        'touchmove',
        (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false },
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
