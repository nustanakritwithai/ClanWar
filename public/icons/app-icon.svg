<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Clan Siege Arena app icon">
  <defs>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b27"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="appShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Rounded app background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#appBg)"/>
  <!-- Crossed siege swords behind shield -->
  <g stroke="#cfa14a" stroke-width="20" stroke-linecap="round">
    <line x1="150" y1="150" x2="362" y2="362"/>
    <line x1="362" y1="150" x2="150" y2="362"/>
  </g>
  <g fill="#f4d35e" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round">
    <path d="M150 150 L120 120 L168 132 L160 160 Z"/>
    <path d="M362 150 L392 120 L344 132 L352 160 Z"/>
  </g>
  <!-- Central shield -->
  <path d="M256 116 L372 156 V262 C372 338 318 388 256 412 C194 388 140 338 140 262 V156 Z"
        fill="url(#appShield)" stroke="#0b0e13" stroke-width="14" stroke-linejoin="round"/>
  <!-- Fortress emblem -->
  <g fill="#0b0e13">
    <rect x="206" y="206" width="26" height="30"/>
    <rect x="243" y="206" width="26" height="30"/>
    <rect x="280" y="206" width="26" height="30"/>
    <rect x="206" y="232" width="100" height="104" rx="5"/>
  </g>
  <path d="M238 336 v-40 a18 18 0 0 1 36 0 v40 Z" fill="#5b9bff"/>
</svg>
