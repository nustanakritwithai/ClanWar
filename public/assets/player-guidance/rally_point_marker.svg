<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rally point guidance marker">
  <!-- Player guidance only - not spawn logic, not bot rally -->
  <ellipse cx="128" cy="210" rx="64" ry="14" fill="#0b0e13" opacity="0.25"/>
  <!-- Rally gathering ring -->
  <circle cx="128" cy="140" r="72" fill="#22d3ee" opacity="0.10"/>
  <circle cx="128" cy="140" r="72" fill="none" stroke="#22d3ee" stroke-width="7" stroke-dasharray="16 12"/>
  <!-- Inward rally chevrons (four directions) -->
  <g fill="#22d3ee" stroke="#0b0e13" stroke-width="5" stroke-linejoin="round">
    <path d="M128 56 L140 76 L116 76 Z"/>
    <path d="M212 140 L192 152 L192 128 Z"/>
    <path d="M128 224 L116 204 L140 204 Z"/>
    <path d="M44 140 L64 128 L64 152 Z"/>
  </g>
  <!-- Rally flag pole -->
  <line x1="128" y1="140" x2="128" y2="56" stroke="#0b0e13" stroke-width="9" stroke-linecap="round"/>
  <path d="M128 56 L168 68 L128 80 Z" fill="#22d3ee" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"/>
  <!-- Center rally pip -->
  <circle cx="128" cy="140" r="16" fill="#22d3ee" stroke="#0b0e13" stroke-width="6"/>
</svg>
