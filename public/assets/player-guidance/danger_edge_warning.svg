<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Danger edge warning guidance marker">
  <!-- Visual edge warning only - not damage zone, not screen bounds collision -->
  <!-- Diagonal edge stripe band -->
  <path d="M0 0 L256 0 L256 80 L80 256 L0 256 Z" fill="#f97316" opacity="0.18"/>
  <!-- Hazard edge chevrons pointing inward -->
  <g fill="#f97316" stroke="#0b0e13" stroke-width="5" stroke-linejoin="round">
    <path d="M48 48 L72 48 L60 72 Z"/>
    <path d="M96 24 L120 24 L108 48 Z"/>
    <path d="M24 96 L48 96 L36 120 Z"/>
    <path d="M144 8 L168 8 L156 32 Z"/>
  </g>
  <!-- Warning bar (drawn shape, not text) -->
  <rect x="36" y="140" width="16" height="48" rx="6" fill="#0b0e13" opacity="0.7"/>
  <circle cx="44" cy="200" r="10" fill="#0b0e13" opacity="0.7"/>
  <!-- Edge border line -->
  <line x1="0" y1="256" x2="256" y2="0" stroke="#ef4444" stroke-width="8" opacity="0.5"/>
</svg>
