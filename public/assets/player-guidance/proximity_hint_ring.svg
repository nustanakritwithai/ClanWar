<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Proximity hint ring guidance marker">
  <!-- Visual proximity indicator only - not capture radius, not collision -->
  <circle cx="128" cy="128" r="108" fill="#22d3ee" opacity="0.06"/>
  <!-- Expanding proximity rings (runtime animates scale/opacity) -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#22d3ee" stroke-width="5" opacity="0.35"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="#22d3ee" stroke-width="6" opacity="0.55"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#22d3ee" stroke-width="7" opacity="0.75"/>
  <!-- Center proximity pip -->
  <circle cx="128" cy="128" r="14" fill="#22d3ee" stroke="#0b0e13" stroke-width="6"/>
  <!-- Cardinal proximity ticks -->
  <g stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <line x1="128" y1="12" x2="128" y2="28"/>
    <line x1="244" y1="128" x2="228" y2="128"/>
    <line x1="128" y1="244" x2="128" y2="228"/>
    <line x1="12" y1="128" x2="28" y2="128"/>
  </g>
</svg>
