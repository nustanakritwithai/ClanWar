<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HUD time up marker">
  <!-- Compact HUD icon (UI-space, not map terrain) -->
  <rect x="32" y="32" width="192" height="192" rx="36" fill="#1a2230" stroke="#0b0e13" stroke-width="10"/>
  <!-- Clock face (closure, not under-attack triangle) -->
  <circle cx="128" cy="124" r="56" fill="none" stroke="#9ca3af" stroke-width="7"/>
  <circle cx="128" cy="124" r="5" fill="#9ca3af" stroke="#0b0e13" stroke-width="3"/>
  <g stroke="#9ca3af" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="124" x2="128" y2="88"/>
    <line x1="128" y1="124" x2="152" y2="136"/>
  </g>
  <!-- Stop bar (time ended, not victory/defeat) -->
  <rect x="80" y="156" width="96" height="16" rx="6" fill="#f59e0b" stroke="#0b0e13" stroke-width="6"/>
  <!-- End ticks -->
  <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="96" y1="184" x2="104" y2="176"/>
    <line x1="160" y1="184" x2="152" y2="176"/>
  </g>
</svg>
