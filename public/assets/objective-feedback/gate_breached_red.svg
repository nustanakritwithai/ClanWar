<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Red gate breached visual state">
  <!-- Breach zone marker (visual state only, not gate HP logic) -->
  <ellipse cx="128" cy="218" rx="100" ry="22" fill="#0b0e13" opacity="0.25"/>
  <!-- Broken stone arch (left segment) -->
  <path d="M36 220 V110 a92 92 0 0 1 72 -58" fill="#3a4658" stroke="#0b0e13" stroke-width="11" stroke-linejoin="round"/>
  <!-- Broken stone arch (right segment, collapsed) -->
  <path d="M220 220 V120 a92 92 0 0 0 -68 -52" fill="#3a4658" stroke="#0b0e13" stroke-width="11" stroke-linejoin="round"/>
  <!-- Open breach gap -->
  <path d="M96 220 V130 a32 32 0 0 1 64 0 V220 Z" fill="#1a2230"/>
  <!-- Fallen rubble -->
  <path d="M88 220 L108 188 L128 204 L148 182 L168 220 Z" fill="#4a5870" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round"/>
  <!-- Snapped red portcullis bars -->
  <g stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="108" y1="140" x2="92" y2="170"/>
    <line x1="148" y1="140" x2="164" y2="168"/>
  </g>
  <!-- Red breach pennant (torn) -->
  <path d="M148 72 L148 44 L172 54 L148 62 Z" fill="#ef4444" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round" opacity="0.6"/>
  <!-- Breach opening highlight ring -->
  <path d="M96 130 a32 32 0 0 1 64 0" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
</svg>
