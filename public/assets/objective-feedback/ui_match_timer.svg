<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HUD match timer chip">
  <!-- Compact HUD icon (UI-space, not map terrain) -->
  <rect x="32" y="32" width="192" height="192" rx="36" fill="#1a2230" stroke="#0b0e13" stroke-width="10"/>
  <!-- Match clock face (neutral, not skill cooldown wedge) -->
  <circle cx="128" cy="132" r="64" fill="none" stroke="#9ca3af" stroke-width="8"/>
  <circle cx="128" cy="132" r="6" fill="#e6edf3" stroke="#0b0e13" stroke-width="4"/>
  <!-- Clock hands -->
  <g stroke="#e6edf3" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="132" x2="128" y2="88"/>
    <line x1="128" y1="132" x2="160" y2="148"/>
  </g>
  <!-- Hour markers (four ticks only) -->
  <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="72" x2="128" y2="80"/>
    <line x1="188" y1="132" x2="180" y2="132"/>
    <line x1="128" y1="192" x2="128" y2="184"/>
    <line x1="68" y1="132" x2="76" y2="132"/>
  </g>
</svg>
