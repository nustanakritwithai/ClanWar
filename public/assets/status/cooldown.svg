<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Cooldown status">
  <!-- Clock = ability recharging (neutral gray) -->
  <circle cx="128" cy="132" r="92" fill="#1a2230" stroke="#9ca3af" stroke-width="12"/>
  <!-- Remaining-time wedge -->
  <path d="M128 132 L128 48 A 84 84 0 0 1 200 174 Z" fill="#9ca3af" opacity="0.4"/>
  <!-- Clock hands -->
  <g stroke="#e6edf3" stroke-width="12" stroke-linecap="round">
    <line x1="128" y1="132" x2="128" y2="78"/>
    <line x1="128" y1="132" x2="172" y2="148"/>
  </g>
  <circle cx="128" cy="132" r="12" fill="#e6edf3"/>
  <!-- Top button -->
  <rect x="112" y="20" width="32" height="18" rx="6" fill="#9ca3af" stroke="#0b0e13" stroke-width="6"/>
</svg>
