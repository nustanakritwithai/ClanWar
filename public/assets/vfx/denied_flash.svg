<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Denied flash">
  <!-- Red "can't do that" pulse: no-entry circle + slash -->
  <circle cx="128" cy="128" r="84" fill="#ef4444" opacity="0.18"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#ef4444" stroke-width="14"/>
  <!-- Diagonal bar -->
  <line x1="74" y1="74" x2="182" y2="182" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>
  <line x1="74" y1="74" x2="182" y2="182" stroke="#0b0e13" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <!-- Short shock ticks -->
  <g stroke="#fca5a5" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="128" y1="30" x2="128" y2="14"/>
    <line x1="226" y1="128" x2="242" y2="128"/>
    <line x1="128" y1="226" x2="128" y2="242"/>
    <line x1="30" y1="128" x2="14" y2="128"/>
  </g>
</svg>
