<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Watchtower objective">
  <!-- Tower shaft (tapered) -->
  <path d="M96 100 L160 100 L172 220 L84 220 Z" fill="#3a4658" stroke="#0b0e13" stroke-width="11" stroke-linejoin="round"/>
  <!-- Lookout platform -->
  <rect x="76" y="76" width="104" height="30" rx="4" fill="#4a5870" stroke="#0b0e13" stroke-width="10"/>
  <!-- Crenellations -->
  <g fill="#4a5870" stroke="#0b0e13" stroke-width="8">
    <rect x="76" y="54" width="22" height="26"/>
    <rect x="117" y="54" width="22" height="26"/>
    <rect x="158" y="54" width="22" height="26"/>
  </g>
  <!-- Eye / lookout light -->
  <circle cx="128" cy="146" r="20" fill="#f4d35e" stroke="#0b0e13" stroke-width="7"/>
  <circle cx="128" cy="146" r="7" fill="#0b0e13"/>
  <!-- Sight beams -->
  <g stroke="#f4d35e" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="138" x2="178" y2="128"/>
    <line x1="106" y1="138" x2="78" y2="128"/>
  </g>
</svg>
