<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Siege Ruins objective">
  <!-- Ground -->
  <ellipse cx="128" cy="206" rx="104" ry="26" fill="#9ca3af" opacity="0.18"/>
  <!-- Broken column left -->
  <path d="M52 206 V120 l34 -8 V206 Z" fill="#4a5870" stroke="#0b0e13" stroke-width="10" stroke-linejoin="round"/>
  <!-- Broken column right (shorter, cracked top) -->
  <path d="M170 206 V150 l36 6 V206 Z" fill="#4a5870" stroke="#0b0e13" stroke-width="10" stroke-linejoin="round"/>
  <!-- Toppled lintel -->
  <path d="M70 110 L196 138 L190 166 L64 138 Z" fill="#3a4658" stroke="#0b0e13" stroke-width="10" stroke-linejoin="round"/>
  <!-- Rubble -->
  <g fill="#3a4658" stroke="#0b0e13" stroke-width="7">
    <rect x="104" y="182" width="34" height="24" rx="4"/>
    <rect x="138" y="190" width="26" height="16" rx="3"/>
  </g>
  <!-- Crack accents -->
  <g stroke="#cfa14a" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="66" y1="150" x2="74" y2="178"/>
    <line x1="182" y1="166" x2="190" y2="190"/>
  </g>
</svg>
