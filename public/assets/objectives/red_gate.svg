<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Red team gate">
  <!-- Stone arch frame -->
  <path d="M44 220 V96 a84 84 0 0 1 168 0 V220 Z" fill="#3a4658" stroke="#0b0e13" stroke-width="12" stroke-linejoin="round"/>
  <!-- Gate opening -->
  <path d="M80 220 V104 a48 48 0 0 1 96 0 V220 Z" fill="#1a2230"/>
  <!-- Red portcullis / energy bars -->
  <g stroke="#ef4444" stroke-width="9" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="220"/>
    <line x1="128" y1="86" x2="128" y2="220"/>
    <line x1="156" y1="100" x2="156" y2="220"/>
    <line x1="82" y1="130" x2="174" y2="130"/>
    <line x1="82" y1="172" x2="174" y2="172"/>
  </g>
  <!-- Battlement top -->
  <g fill="#3a4658" stroke="#0b0e13" stroke-width="8">
    <rect x="44" y="56" width="28" height="28"/>
    <rect x="114" y="40" width="28" height="28"/>
    <rect x="184" y="56" width="28" height="28"/>
  </g>
  <!-- Red team pennants -->
  <g fill="#ef4444" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round">
    <path d="M128 40 L128 8 L160 18 L128 28 Z"/>
  </g>
  <path d="M128 8 V40" stroke="#0b0e13" stroke-width="6" stroke-linecap="round"/>
