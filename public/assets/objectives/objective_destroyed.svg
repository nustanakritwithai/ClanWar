  <!-- Broken rubble base -->
  <path d="M40 206 L66 168 L100 184 L128 152 L156 184 L190 166 L216 206 Z"
        fill="#3a4658" stroke="#0b0e13" stroke-width="11" stroke-linejoin="round"/>
  <!-- Snapped pillar stump (left) -->
  <path d="M74 184 V128 l30 -6 V176 Z" fill="#4a5870" stroke="#0b0e13" stroke-width="10" stroke-linejoin="round"/>
  <!-- Snapped pillar stump (right, jagged) -->
  <path d="M150 184 V140 l16 -12 14 14 V178 Z" fill="#4a5870" stroke="#0b0e13" stroke-width="10" stroke-linejoin="round"/>
  <!-- Smoke puffs -->
  <g fill="#9ca3af" opacity="0.55">
    <circle cx="116" cy="92" r="22"/>
    <circle cx="146" cy="70" r="18"/>
    <circle cx="100" cy="62" r="15"/>
  </g>
  <!-- Cracks -->
  <g stroke="#0b0e13" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M128 152 L120 180 L134 200"/>
  </g>
</svg>
