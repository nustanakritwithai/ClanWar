<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Danger zone visual marker">
  <!-- Hazard stripe overlay  -  visual only, NOT a damage zone -->
  <circle cx="128" cy="128" r="100" fill="#f97316" opacity="0.12" stroke="#0b0e13" stroke-width="8"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="16 12"/>
  <!-- Diagonal hazard stripes (distinct from UI buttons) -->
  <g stroke="#ef4444" stroke-width="12" opacity="0.35" stroke-linecap="square">
    <line x1="48" y1="48" x2="120" y2="120"/><line x1="88" y1="48" x2="160" y2="120"/>
    <line x1="128" y1="48" x2="200" y2="120"/><line x1="168" y1="48" x2="240" y2="120"/>
    <line x1="48" y1="88" x2="120" y2="160"/><line x1="88" y1="128" x2="160" y2="200"/>
  </g>
  <path d="M128 72 L148 116 L108 116 Z" fill="#f97316" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"/>
  <rect x="122" y="118" width="12" height="28" rx="4" fill="#0b0e13"/>
</svg>
