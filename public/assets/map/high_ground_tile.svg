<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="High ground route tile">
  <!-- Elevated stone plateau  -  lighter top, drop shadow on edges -->
  <rect x="16" y="16" width="224" height="224" rx="8" fill="#1a2230" stroke="#0b0e13" stroke-width="10"/>
  <!-- Cliff drop shadow (reads elevated) -->
  <path d="M28 200 L228 200 L240 228 L16 228 Z" fill="#0b0e13" opacity="0.55"/>
  <path d="M200 28 L228 28 L240 228 L200 200 Z" fill="#0b0e13" opacity="0.35"/>
  <!-- Raised plateau surface -->
  <rect x="32" y="32" width="192" height="168" rx="6" fill="#4a5870" stroke="#0b0e13" stroke-width="8"/>
  <rect x="44" y="44" width="168" height="144" rx="4" fill="#5b6d88"/>
  <!-- Elevation contour lines -->
  <g fill="none" stroke="#e6edf3" stroke-width="4" opacity="0.25">
    <rect x="60" y="60" width="136" height="112" rx="4"/>
    <rect x="76" y="76" width="104" height="80" rx="4"/>
  </g>
  <!-- Highlight ridge -->
  <path d="M44 44 L212 44" stroke="#e6edf3" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
</svg>
