<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Main army route tile">
  <!-- Worn dirt/stone main route  -  warm tan, directional wear lines -->
  <rect x="8" y="8" width="240" height="240" rx="6" fill="#2a2418" stroke="#0b0e13" stroke-width="8"/>
  <rect x="20" y="20" width="216" height="216" rx="4" fill="#4a3d2e"/>
  <!-- Directional wear ruts (main route reads as traveled path) -->
  <g stroke="#6b5a42" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="48" y1="128" x2="208" y2="128"/>
    <line x1="56" y1="108" x2="200" y2="108"/>
    <line x1="56" y1="148" x2="200" y2="148"/>
  </g>
  <!-- Cobble edge hints -->
  <g fill="#3a3228" stroke="#0b0e13" stroke-width="4">
    <circle cx="36" cy="36" r="10"/><circle cx="220" cy="36" r="10"/>
    <circle cx="36" cy="220" r="10"/><circle cx="220" cy="220" r="10"/>
  </g>
  <!-- Center route stripe -->
  <rect x="88" y="24" width="80" height="208" rx="8" fill="#cfa14a" opacity="0.12"/>
</svg>
