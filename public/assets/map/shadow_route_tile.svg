<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Shadow sewer route tile">
  <!-- Dark stealth/sewer path  -  purple-gray brick, subtle moisture -->
  <rect x="8" y="8" width="240" height="240" rx="6" fill="#12101a" stroke="#0b0e13" stroke-width="8"/>
  <rect x="20" y="20" width="216" height="216" rx="4" fill="#1e1a2e"/>
  <!-- Brick pattern (distinct from main route) -->
  <g stroke="#2d2840" stroke-width="3">
    <line x1="20" y1="60" x2="236" y2="60"/><line x1="20" y1="100" x2="236" y2="100"/>
    <line x1="20" y1="140" x2="236" y2="140"/><line x1="20" y1="180" x2="236" y2="180"/>
    <line x1="60" y1="20" x2="60" y2="236"/><line x1="128" y1="20" x2="128" y2="236"/>
    <line x1="196" y1="20" x2="196" y2="236"/>
  </g>
  <!-- Dark center channel -->
  <rect x="72" y="40" width="112" height="176" rx="56" fill="#0b0e13" opacity="0.65"/>
  <ellipse cx="128" cy="128" rx="40" ry="72" fill="#9333ea" opacity="0.08"/>
  <!-- Drip accents -->
  <g fill="#4a5870" opacity="0.5">
    <ellipse cx="100" cy="90" rx="6" ry="10"/><ellipse cx="156" cy="170" rx="6" ry="10"/>
  </g>
</svg>
