<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Virtual joystick knob">
  <defs>
    <radialGradient id="knobShade" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.20"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#knobShade)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Grip highlight -->
