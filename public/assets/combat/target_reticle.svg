<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Target reticle">
  <!-- Neutral lock-on reticle (runtime tints for friendly/hostile). -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#e6edf3" stroke-width="8" stroke-dasharray="20 16"/>
  <!-- Corner brackets -->
  <g fill="none" stroke="#e6edf3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 90 V62 H90"/>
    <path d="M194 90 V62 H166"/>
    <path d="M62 166 V194 H90"/>
    <path d="M194 166 V194 H166"/>
  </g>
  <!-- Center dot + ticks -->
  <circle cx="128" cy="128" r="10" fill="#ef4444" stroke="#0b0e13" stroke-width="4"/>
  <g stroke="#e6edf3" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="98" x2="128" y2="112"/>
    <line x1="128" y1="144" x2="128" y2="158"/>
    <line x1="98" y1="128" x2="112" y2="128"/>
    <line x1="144" y1="128" x2="158" y2="128"/>
  </g>
</svg>
