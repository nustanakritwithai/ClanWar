<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Area-of-effect target marker">
  <!-- Ground AoE target (neutral; runtime tints by friendly/hostile). -->
  <circle cx="128" cy="128" r="100" fill="#f97316" opacity="0.16"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#f97316" stroke-width="8"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="6 10" opacity="0.7"/>
  <!-- Crosshair targeting -->
  <g stroke="#fff7d6" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="78" x2="128" y2="178"/>
    <line x1="78" y1="128" x2="178" y2="128"/>
  </g>
  <circle cx="128" cy="128" r="16" fill="none" stroke="#fff7d6" stroke-width="6"/>
</svg>
